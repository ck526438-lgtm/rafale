[package]
name = "rafale"
version = "0.1.0"
edition = "2021"
description = "Scan a repo, find dead and costly functions, get a refactoring plan from a local LLM"
license = "MIT"

[dependencies]
aho-corasick = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "cargo", "string"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
